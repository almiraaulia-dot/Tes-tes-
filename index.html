<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manipulasi Elemen - Beban Pikiran</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      background: linear-gradient(to bottom, #87cefa, #1e90ff);
      display:flex;
      flex-direction:column;
      align-items:center;
      color:white;
      position:relative;
    }

    h1{
      margin-top:20px;
      font-size:32px;
      text-shadow:2px 2px 5px rgba(0,0,0,0.3);
    }

    p{
      margin-top:10px;
      text-align:center;
      width:80%;
    }

    .input-box{
      margin-top:20px;
      width:80%;
      max-width:500px;
    }

    textarea{
      width:100%;
      height:100px;
      border:none;
      border-radius:15px;
      padding:15px;
      font-size:16px;
      resize:none;
      outline:none;
      background:white;
      color:#333;
      box-shadow:0 5px 10px rgba(0,0,0,0.2);
    }

    .scene{
      width:100%;
      height:100%;
      position:relative;
    }

    .box{
      width:170px;
      height:170px;
      background:linear-gradient(135deg,#4facfe,#00c6ff);
      border-radius:20px;
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top:180px;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:15px;
      font-size:20px;
      font-weight:bold;
      box-shadow:0 10px 20px rgba(0,0,0,0.3);
      transition: top 0.5s ease;
    }

    /* Stiker lucu */
    .cloud{
      position:absolute;
      font-size:50px;
      animation: moveCloud 18s linear infinite;
      opacity:0.8;
    }

    .cloud:nth-child(1){
      top:80px;
      left:-100px;
      animation-duration:18s;
    }

    .cloud:nth-child(2){
      top:180px;
      left:-200px;
      animation-duration:25s;
    }

    .cloud:nth-child(3){
      top:300px;
      left:-150px;
      animation-duration:20s;
    }

    @keyframes moveCloud{
      from{
        transform:translateX(0);
      }
      to{
        transform:translateX(130vw);
      }
    }

    .bubble{
      position:absolute;
      bottom:-50px;
      font-size:30px;
      animation: floatUp linear infinite;
      opacity:0.7;
    }

    .bubble:nth-child(4){
      left:10%;
      animation-duration:8s;
    }

    .bubble:nth-child(5){
      left:50%;
      animation-duration:10s;
    }

    .bubble:nth-child(6){
      left:80%;
      animation-duration:7s;
    }

    @keyframes floatUp{
      from{
        transform:translateY(0);
      }
      to{
        transform:translateY(-120vh);
      }
    }

  </style>
</head>
<body>

  <h1>Manipulasi Elemen</h1>
  <p>
    Ketik "beban pikiran" kamu di bawah ini.
    Semakin panjang tulisanmu, kotak akan turun karena semakin berat.
  </p>

  <div class="input-box">
    <textarea id="textInput" placeholder="Tulis beban pikiranmu di sini..."></textarea>
  </div>

  <div class="scene">

    <!-- Stiker lucu -->
    <div class="cloud">☁️</div>
    <div class="cloud">💭</div>
    <div class="cloud">☁️</div>

    <div class="bubble">🫧</div>
    <div class="bubble">⭐</div>
    <div class="bubble">💙</div>

    <!-- Kotak utama -->
    <div class="box" id="box">
      Beban Pikiran
    </div>

  </div>

  <script>
    const input = document.getElementById("textInput");
    const box = document.getElementById("box");

    input.addEventListener("input", () => {

      let panjang = input.value.length;

      // Posisi awal
      let posisiAwal = 180;

      // Semakin panjang teks semakin turun
      let turun = panjang * 3;

      // Batas maksimal turun
      if(turun > 400){
        turun = 400;
      }

      // Ubah posisi kotak
      box.style.top = (posisiAwal + turun) + "px";

      // Isi tulisan di dalam kotak
      if(input.value.trim() === ""){
        box.innerHTML = "Beban Pikiran";
      } else {
        box.innerHTML = "😵‍💫<br>" + input.value;
      }

    });
  </script>

</body>
</html>
